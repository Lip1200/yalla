# Docker Compose override — self-hosted Supabase stack (Path A)
#
# Drops in next to the existing `docker-compose.yml`. Replaces the
# Supabase cloud dependency with a fully local stack (Postgres + GoTrue
# + PostgREST + Storage + Kong gateway), so the backend can keep
# talking to `SUPABASE_URL=http://kong:8000` exactly as it does today
# against the cloud — zero application code changes.
#
# Usage
# -----
#   cd /opt/yalla
#   cp deploy/self-hosted/.env.example deploy/self-hosted/.env
#   # 1) generate POSTGRES_PASSWORD, JWT_SECRET, DASHBOARD_PASSWORD
#   # 2) generate ANON_KEY + SERVICE_ROLE_KEY:
#   uv run python deploy/self-hosted/scripts/gen-jwt.py "$JWT_SECRET"
#   # 3) paste both keys into the .env file
#
#   # Combine the override with the base compose and start the stack:
#   docker compose \
#       -f docker-compose.yml \
#       -f deploy/self-hosted/docker-compose.override.yml \
#       --env-file deploy/self-hosted/.env \
#       up -d
#
#   # Apply our 18 SQL migrations into the local DB (one-shot):
#   docker compose exec -T db psql -U postgres < supabase/migrations/001_groups.sql
#   # … repeat for 002..018 (or run `for f in supabase/migrations/*.sql; do …; done`)
#
# Resource note
# -------------
# The full stack uses ~1.5 GB of RAM at idle. The current 1 vCPU / 1 GB
# droplet is too small — upgrade to 2 vCPU / 2 GB before switching.

services:
  # --- Existing backend: rewire to talk to the local Kong gateway ---
  backend:
    depends_on:
      kong:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_KEY: ${SERVICE_ROLE_KEY}
      # The legacy `sb_secret_*` shape is replaced by a JWT signed with
      # JWT_SECRET (role=service_role). supabase-py treats both as a
      # plain bearer string — no code change required.

  # --- PostgreSQL (Supabase fork with auth/storage schemas baked in) ---
  db:
    image: supabase/postgres:15.1.0.117
    container_name: yalla-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/self-hosted/postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    # Internal network only — never expose 5432 publicly. The backend +
    # auth + rest + storage connect via the docker network alias `db`.

  # --- Auth (GoTrue) — issues JWTs, manages users, refresh tokens ---
  auth:
    image: supabase/gotrue:v2.150.0
    container_name: yalla-auth
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL},yalla://*
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Demo mode — skip email confirmation. For prod, set this to
      # "false" and wire SMTP/Resend env vars (GOTRUE_SMTP_*).
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  # --- PostgREST — auto-generates the REST API from the DB schema ---
  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: yalla-rest
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  # --- Storage — file uploads (feed images) ---
  storage:
    image: supabase/storage-api:v1.10.0
    container_name: yalla-storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    restart: unless-stopped
    volumes:
      - storage:/var/lib/storage
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800   # 50 MB
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      # Stub values: required by the storage-api image but unused for
      # local file backend.
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub

  # --- Kong gateway — fans /auth/v1, /rest/v1, /storage/v1 ---
  kong:
    image: kong:2.8
    container_name: yalla-kong
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      storage:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - ./deploy/self-hosted/kong.yml:/var/lib/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    # Kong's 8000 is reached internally by the backend; not exposed
    # publicly — Caddy keeps fronting only /api on the backend.

  # --- Studio + meta (optional admin UI) ----------------------------
  # Disable both blocks in prod by adding `profiles: [admin]` and only
  # starting with `--profile admin` locally.
  meta:
    image: supabase/postgres-meta:v0.83.2
    container_name: yalla-meta
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: supabase/studio:20240422-5cf8f30
    container_name: yalla-studio
    depends_on:
      meta:
        condition: service_started
      kong:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # Localhost-only bind: SSH tunnel to access it remotely.
      # Never expose Studio publicly — it grants service-role access.
      - "127.0.0.1:3000:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Yalla
      DEFAULT_PROJECT_NAME: yalla-self-hosted
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SITE_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}

volumes:
  pgdata:
  storage:
