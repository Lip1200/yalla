# Kong declarative routing for the self-hosted Supabase stack.
#
# What our backend hits — `SUPABASE_URL/<path>` :
#   /auth/v1/…      → GoTrue   (signup, login, refresh, get_user)
#   /rest/v1/…      → PostgREST (`.table().select().execute()` calls)
#   /storage/v1/…   → Storage   (feed image uploads)
#
# Each route strips its prefix before forwarding, so PostgREST sees
# `/profiles?select=…` etc. as if it were called natively.

_format_version: "1.1"

services:
  # ── Auth (GoTrue) ────────────────────────────────────────────────
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["Accept", "Authorization", "Content-Type", "X-Client-Info", "apikey"]
          credentials: true
          max_age: 3600

  # ── PostgREST ─────────────────────────────────────────────────────
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["Accept", "Authorization", "Content-Type", "X-Client-Info", "apikey", "Prefer", "Range"]
          credentials: true
          max_age: 3600

  # ── Storage ──────────────────────────────────────────────────────
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["Accept", "Authorization", "Content-Type", "X-Client-Info", "apikey"]
          credentials: true
          max_age: 3600
