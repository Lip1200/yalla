# Minimal Nginx config for serving the Vite-built doctor-web SPA.
# Designed to sit behind Caddy (which terminates TLS upstream), so this
# block listens on plain HTTP only.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip pre-compressed assets where possible
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — anything that doesn't map to a file goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint for compose healthchecks
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }
}
